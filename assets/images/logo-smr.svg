<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a8fd4"/>
      <stop offset="50%" stop-color="#0d6fc6"/>
      <stop offset="100%" stop-color="#0a5ca6"/>
    </linearGradient>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eef4"/>
      <stop offset="40%" stop-color="#b0c4d8"/>
      <stop offset="100%" stop-color="#8aa4bc"/>
    </linearGradient>
    <linearGradient id="loop-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2196e3"/>
      <stop offset="50%" stop-color="#0d6fc6"/>
      <stop offset="100%" stop-color="#b0c4d8"/>
    </linearGradient>
    <linearGradient id="loop-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0c4d8"/>
      <stop offset="50%" stop-color="#0d6fc6"/>
      <stop offset="100%" stop-color="#2196e3"/>
    </linearGradient>
  </defs>

  <!-- Infinity loop - left lobe -->
  <ellipse cx="155" cy="62" rx="58" ry="42" fill="none" stroke="url(#loop-left)" stroke-width="14" stroke-linecap="round"/>
  <!-- Infinity loop - right lobe -->
  <ellipse cx="245" cy="62" rx="58" ry="42" fill="none" stroke="url(#loop-right)" stroke-width="14" stroke-linecap="round"/>

  <!-- Center overlap mask -->
  <rect x="185" y="35" width="30" height="54" fill="none"/>

  <!-- SMR Letters -->
  <text x="148" y="78" font-family="'Sora','Trebuchet MS',sans-serif" font-size="52" font-weight="800" text-anchor="middle" fill="url(#silver-grad)">S</text>
  <text x="200" y="78" font-family="'Sora','Trebuchet MS',sans-serif" font-size="52" font-weight="800" text-anchor="middle" fill="url(#silver-grad)">M</text>
  <text x="254" y="78" font-family="'Sora','Trebuchet MS',sans-serif" font-size="52" font-weight="800" text-anchor="middle" fill="url(#silver-grad)">R</text>

  <!-- Company Name -->
  <text x="200" y="128" font-family="'Sora','Trebuchet MS',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="url(#silver-grad)" letter-spacing="3">SHILUNGWA MINING</text>

  <!-- Decorative lines -->
  <line x1="90" y1="140" x2="170" y2="140" stroke="url(#blue-grad)" stroke-width="1.5"/>
  <line x1="230" y1="140" x2="310" y2="140" stroke="url(#blue-grad)" stroke-width="1.5"/>

  <!-- AND RESOURCES -->
  <text x="200" y="155" font-family="'Sora','Trebuchet MS',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="url(#silver-grad)" letter-spacing="5">AND RESOURCES</text>

  <!-- Tagline -->
  <text x="200" y="182" font-family="'Public Sans','Segoe UI',sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#2196e3" letter-spacing="0.5">powering the present, reshaping the future</text>
</svg>
